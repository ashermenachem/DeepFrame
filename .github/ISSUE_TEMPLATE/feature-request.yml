name: Feature request
description: Suggest an improvement for DeepFrame
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need before describing the feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a great solution feel like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context
      description: Share related tools, formats, metadata standards, or workflows.
  - type: checkboxes
    id: privacy
    attributes:
      label: Product principles
      options:
        - label: This idea preserves DeepFrame's local-first, zero-upload privacy model.
          required: true
